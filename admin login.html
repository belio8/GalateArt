<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Login – GalateArt</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:       #0f0f17;
      --surface:  #16161f;
      --surface2: #1e1e2c;
      --border:   #2a2a3a;
      --accent:   #7c6aff;
      --danger:   #e05c5c;
      --text:     #e0e0e8;
      --muted:    #666680;
    }

    body {
      font-family: 'Poppins', sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* Animated background dots */
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background-image:
        radial-gradient(circle at 20% 30%, rgba(124,106,255,.08) 0%, transparent 50%),
        radial-gradient(circle at 80% 70%, rgba(92,221,139,.05) 0%, transparent 50%);
      pointer-events: none;
    }

    .login-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 42px 38px 36px;
      width: 400px;
      max-width: 94vw;
      position: relative;
      box-shadow: 0 24px 64px rgba(0,0,0,.5);
      animation: slideUp .3s ease;
    }
    @keyframes slideUp {
      from { opacity:0; transform: translateY(24px); }
      to   { opacity:1; transform: translateY(0); }
    }

    .login-logo {
      font-size: 22px;
      font-weight: 700;
      margin-bottom: 4px;
    }
    .login-logo span { color: var(--accent); }

    .login-subtitle {
      font-size: 12px;
      color: var(--muted);
      margin-bottom: 32px;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .login-subtitle i { color: var(--accent); font-size: 11px; }

    .field-label {
      font-size: 12px;
      font-weight: 600;
      color: var(--muted);
      margin-bottom: 7px;
      display: block;
      text-transform: uppercase;
      letter-spacing: .05em;
    }

    .field-wrap {
      position: relative;
      margin-bottom: 18px;
    }

    .field-wrap i.field-icon {
      position: absolute;
      left: 14px;
      top: 50%;
      transform: translateY(-50%);
      color: var(--muted);
      font-size: 14px;
      pointer-events: none;
    }

    .field-wrap input {
      width: 100%;
      background: var(--surface2);
      border: 1.5px solid var(--border);
      border-radius: 10px;
      padding: 12px 14px 12px 40px;
      color: var(--text);
      font-family: 'Poppins', sans-serif;
      font-size: 13.5px;
      outline: none;
      transition: border-color .2s;
    }
    .field-wrap input:focus { border-color: var(--accent); }
    .field-wrap input.error { border-color: var(--danger); }

    .toggle-pw {
      position: absolute;
      right: 12px;
      top: 50%;
      transform: translateY(-50%);
      background: none;
      border: none;
      color: var(--muted);
      cursor: pointer;
      font-size: 14px;
      padding: 4px;
      transition: color .2s;
    }
    .toggle-pw:hover { color: var(--text); }

    .error-msg {
      background: rgba(224,92,92,.1);
      border: 1px solid rgba(224,92,92,.3);
      border-radius: 9px;
      padding: 10px 14px;
      font-size: 12.5px;
      color: var(--danger);
      margin-bottom: 16px;
      display: none;
      align-items: center;
      gap: 8px;
    }
    .error-msg.show { display: flex; }

    .btn-login {
      width: 100%;
      padding: 13px;
      background: var(--accent);
      color: #fff;
      border: none;
      border-radius: 10px;
      font-family: 'Poppins', sans-serif;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      margin-top: 8px;
      transition: background .2s, transform .1s;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }
    .btn-login:hover { background: #6a58e8; }
    .btn-login:active { transform: scale(.98); }
    .btn-login:disabled { opacity: .5; cursor: default; }

    .login-footer {
      margin-top: 24px;
      text-align: center;
      font-size: 12px;
      color: var(--muted);
    }
    .login-footer a {
      color: var(--accent);
      text-decoration: none;
    }
    .login-footer a:hover { text-decoration: underline; }

    .divider {
      border: none;
      border-top: 1px solid var(--border);
      margin: 24px 0 20px;
    }

    .hint-box {
      background: rgba(124,106,255,.06);
      border: 1px solid rgba(124,106,255,.2);
      border-radius: 10px;
      padding: 12px 14px;
      font-size: 12px;
      color: var(--muted);
      line-height: 1.6;
    }
    .hint-box strong { color: var(--accent); }

    /* Loading spinner */
    .spinner {
      width: 16px; height: 16px;
      border: 2px solid rgba(255,255,255,.3);
      border-top-color: #fff;
      border-radius: 50%;
      animation: spin .6s linear infinite;
      display: none;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>

<div class="login-card">
  <div class="login-logo">Galate<span>Art</span></div>
  <p class="login-subtitle"><i class="fas fa-shield-alt"></i> Panel Admin — Akses Terbatas</p>

  <div class="error-msg" id="errorMsg">
    <i class="fas fa-exclamation-circle"></i>
    <span id="errorText">Username atau kata sandi salah.</span>
  </div>

  <div class="field-wrap">
    <label class="field-label" for="adminUser">Username</label>
    <i class="fas fa-user field-icon"></i>
    <input type="text" id="adminUser" placeholder="Masukkan username admin..." autocomplete="username">
  </div>

  <div class="field-wrap">
    <label class="field-label" for="adminPass">Kata Sandi</label>
    <i class="fas fa-lock field-icon"></i>
    <input type="password" id="adminPass" placeholder="Masukkan kata sandi..." autocomplete="current-password">
    <button class="toggle-pw" id="togglePw" type="button" tabindex="-1">
      <i class="fas fa-eye" id="eyeIcon"></i>
    </button>
  </div>

  <button class="btn-login" id="btnLogin">
    <span id="btnText">Masuk ke Admin Panel</span>
    <div class="spinner" id="spinner"></div>
  </button>

  <hr class="divider">

  <div class="hint-box">
    <strong>Kredensial Default:</strong><br>
    Username: <strong>admin</strong> &nbsp;|&nbsp; Password: <strong>galateart2024</strong><br>
    <span style="font-size:11px;margin-top:4px;display:block;">Ganti kredensial ini setelah login pertama.</span>
  </div>

  <p class="login-footer">
    <a href="landing.html"><i class="fas fa-arrow-left"></i> Kembali ke beranda</a>
  </p>
</div>

<script>
  // ── Kredensial admin (simpan di localStorage agar bisa diubah) ──
  const DEFAULT_ADMIN = { username: 'admin', password: 'admin123' };

  function getAdminCreds() {
    const saved = localStorage.getItem('ga_admin_creds');
    return saved ? JSON.parse(saved) : DEFAULT_ADMIN;
  }

  // Jika sudah login, langsung redirect
  if (sessionStorage.getItem('ga_admin_auth') === 'true') {
    location.href = 'admin.html';
  }

  // Toggle tampilkan/sembunyikan password
  document.getElementById('togglePw').addEventListener('click', function () {
    const inp = document.getElementById('adminPass');
    const ico = document.getElementById('eyeIcon');
    if (inp.type === 'password') {
      inp.type = 'text';
      ico.className = 'fas fa-eye-slash';
    } else {
      inp.type = 'password';
      ico.className = 'fas fa-eye';
    }
  });

  function showError(msg) {
    const box = document.getElementById('errorMsg');
    document.getElementById('errorText').textContent = msg;
    box.classList.add('show');
    document.getElementById('adminUser').classList.add('error');
    document.getElementById('adminPass').classList.add('error');
  }

  function clearError() {
    document.getElementById('errorMsg').classList.remove('show');
    document.getElementById('adminUser').classList.remove('error');
    document.getElementById('adminPass').classList.remove('error');
  }

  function doLogin() {
    clearError();
    const user = document.getElementById('adminUser').value.trim();
    const pass = document.getElementById('adminPass').value;

    if (!user || !pass) {
      showError('Username dan kata sandi tidak boleh kosong.');
      return;
    }

    // Tampilkan loading
    const btn = document.getElementById('btnLogin');
    document.getElementById('btnText').textContent = 'Memeriksa...';
    document.getElementById('spinner').style.display = 'block';
    btn.disabled = true;

    // Simulasi delay autentikasi
    setTimeout(() => {
      const creds = getAdminCreds();
      if (user === creds.username && pass === creds.password) {
        sessionStorage.setItem('ga_admin_auth', 'true');
        sessionStorage.setItem('ga_admin_user', user);
        location.href = 'admin.html';
      } else {
        document.getElementById('btnText').textContent = 'Masuk ke Admin Panel';
        document.getElementById('spinner').style.display = 'none';
        btn.disabled = false;
        showError('Username atau kata sandi salah.');
        document.getElementById('adminPass').value = '';
        document.getElementById('adminPass').focus();
      }
    }, 700);
  }

  document.getElementById('btnLogin').addEventListener('click', doLogin);

  // Enter untuk submit
  ['adminUser', 'adminPass'].forEach(id => {
    document.getElementById(id).addEventListener('keydown', e => {
      if (e.key === 'Enter') doLogin();
    });
  });
</script>
</body>
</html>
